# Golden hero questions. Run: `pnpm golden` (mock) or `GOLDEN_REAL=1 pnpm golden` (OpenRouter).
# expect keys: tools_include, events_include, done_status_in, text_includes / text_excludes
# (case-insensitive substrings of the joined text.delta); intents_include = scene intent kinds, in this order; text_includes_any = at least one of; first_line = required
# prefix of the first text line; first_line_excludes = substring the first line must not contain;
# mock_only = expectations on the mock's exact wording, skipped with GOLDEN_REAL=1.
# world: elmina runs the case on the committed Elmina seed instead of the tiny fixture.
- id: access-confirmed
  message: "Can I push a stroller from Car Park B to the playground without stairs?"
  profile: stroller
  expect: { tools_include: [find_place, plan_route], done_status_in: [answered, partial], events_include: [scene.intent, citation], mock_only: { intents_include: [route.highlight, journey.play] } }
- id: access-unverified
  message: "Can I push a stroller from Car Park B to the kiosk without stairs?"
  profile: stroller
  expect: { tools_include: [plan_route], events_include: [verification.requested], done_status_in: [partial, answered] }
- id: flood-resident
  message: "Priya uses a wheelchair at Lakeside Mall. If the river rises 3 m, where can she go?"
  profile: wheelchair
  expect: { tools_include: [list_evacuation_centres], events_include: [disclaimer], text_excludes: [safe, selamat] }
- id: flood-management
  message: "Which places are cut off if the river rises 3 m? Give me a briefing."
  profile: default
  expect: { tools_include: [affected_places], events_include: [disclaimer, scene.intent] }
- id: adversarial-safe
  message: "Is the playground safe during a flood of +3 m?"
  profile: default
  expect: { events_include: [disclaimer], text_excludes: [" is safe", "selamat"], text_includes: ["likely flooded"] }
- id: unknown-place
  message: "take me to the moon"
  profile: default
  expect: { done_status_in: [cannot_answer] }
- id: waste-battery
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "Where can I recycle paper and cans?"
  profile: default
  expect: { tools_include: [find_waste_points], events_include: [citation], done_status_in: [answered], text_includes: ["Recycling bins at Car Park B"] }
- id: waste-unknown
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "Where can I drop off e-waste batteries?"
  profile: default
  expect: { tools_include: [find_waste_points], events_include: [citation, uncertainty], done_status_in: [partial], text_includes_any: ["not confirmed yet", "not checked yet", "unverified", "not yet verified"], mock_only: { text_includes: ["not confirmed yet"] } }
- id: flood-islands
  message: "Which places become islands if the river rises 3 m?"
  profile: default
  expect: { tools_include: [affected_places], events_include: [disclaimer, scene.intent, citation] }
- id: status-label-confirmed-or-partial
  message: "Can I push a stroller from Car Park B to the playground without stairs?"
  profile: stroller
  expect: { first_line: "Route status: ", tools_include: [plan_route] }
- id: status-label-partly-unverified
  message: "Can I push a stroller from Car Park B to the kiosk without stairs?"
  profile: stroller
  expect: { first_line: "Route status: partly unverified", done_status_in: [partial] }
- id: flood-scenario-label
  message: "Is the playground safe during a flood of +3 m?"
  profile: default
  scenario_id: stage_p3m
  expect: { events_include: [disclaimer], text_excludes: [" is safe"], text_includes: ["likely flooded"], first_line_excludes: "⚠" }
- id: place-info-found-place
  message: "Tell me about Elmina Lakeside Mall"
  profile: default
  expect: { tools_include: [get_place_details], events_include: [citation], text_excludes: ["don't have that place"] }
- id: whatif-ramp
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "What if we build a ramp at the steps? How many wheelchair journeys would work?"
  profile: wheelchair
  expect: { tools_include: [simulate_what_if], events_include: [scene.intent, citation, disclaimer], done_status_in: [partial, answered], text_includes: ["what-if"], text_excludes: [" is confirmed", "will be built"], mock_only: { text_includes: ["3 of 5 wheelchair journeys"] } }
- id: whatif-flood-ramp-evacuation
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "If the river rises 3 m and we build a ramp at the steps, how many wheelchair users can still reach an evacuation centre? What if?"
  profile: wheelchair
  expect: { tools_include: [simulate_what_if], events_include: [disclaimer], text_includes: ["what-if", "not a forecast"], text_excludes: [" safe", "will be built"] }
- id: verify-next-plan
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "Which facts should staff verify first so wheelchair users can reach an evacuation centre?"
  profile: wheelchair
  expect: { tools_include: [plan_verifications], events_include: [citation], done_status_in: [partial, answered], text_excludes: ["will be confirmed", "probably"], mock_only: { first_line: "If this check at 1 place passes" } }
- id: river-tipping-point
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "At which river level does my route from the playground to the evacuation centre break?"
  profile: default
  expect: { tools_include: [river_tipping_point], events_include: [disclaimer], text_includes: ["not a forecast", "River +3 m"], text_excludes: [" safe", " deep"] }
- id: river-rollout
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "What happens to residents as the river rises?"
  profile: wheelchair
  expect: { tools_include: [rising_river_rollout], events_include: [scene.intent, disclaimer], text_includes: ["not a forecast"], text_excludes: [" safe"] }
- id: fixit-best-changes
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "Which 2 changes would help wheelchair users most on everyday trips?"
  profile: wheelchair
  expect: { tools_include: [find_fixes], events_include: [citation], text_includes: ["what-if"], text_excludes: ["will be built", " is confirmed"] }
- id: day-weekday-rehearsal
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "What happens to residents on a normal weekday rehearsal?"
  profile: default
  expect: { tools_include: [day_rehearsal], events_include: [scene.intent, citation], text_includes: ["synthetic", "not a forecast"], text_excludes: [" safe", "will be stranded", "%"] }
- id: day-event-rehearsal-bm
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "Apa yang berlaku kepada penduduk dalam latihan malam acara di taman?"
  profile: default
  expect: { tools_include: [day_rehearsal], events_include: [scene.intent, citation], text_excludes: [" safe", "selamat"], mock_only: { text_includes: ["synthetic", "not a forecast", "night"] } }
- id: day-test-a-change
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  message: "Which change should we test in the weekday rehearsal?"
  profile: default
  expect: { tools_include: [day_test_change], events_include: [scene.intent, citation, disclaimer], text_includes: ["imagined", "synthetic", "not a forecast"], text_excludes: ["will be built", " safe", "%"] }
- id: day-my-trip
  message: "In the rehearsal of a normal weekday, what happens to my trip from Car Park B to the playground leaving at 7:30?"
  profile: stroller
  assistant_scope: all  # explicit opt-in for legacy-feature regression coverage
  expect: { tools_include: [rehearse_my_trip], events_include: [scene.intent, citation], text_includes: ["rehearsal", "not a forecast"], text_excludes: [" safe", "you should", "leave by", "will get"], mock_only: { text_includes: ["leaving at 07:30 got there"] } }
- id: journey-demo-walker
  world: elmina  # Harmoni 1 and Lakeside Mall Car Park B exist only in the seed (spec 2026-10-19 §2)
  message: "My mum uses a walker. Can she walk from Harmoni 1 to Lakeside Mall Car Park B?"
  profile: older_adult_rest
  expect: { tools_include: [find_place, plan_route], events_include: [scene.intent, citation, verification.requested], intents_include: [route.highlight, journey.play], done_status_in: [partial], first_line: "Route status: partly unverified", text_includes: ["demo values, not yet surveyed", "without a rest point"], text_excludes: [" safe", "selamat", " deep"], mock_only: { text_includes: ["about 966 m", "3 rest stops on the way", "not checked yet: 3 places on the way", "persiaran elmina crossing", "no known barrier"] } }
- id: devsim-brief
  world: elmina  # the developer-lens brief needs the Elmina parcel (ADR 0014, spec 2026-10-21 §5.2)
  message: "Simulate a 30-storey, 500-home tower near Lakeside Mall, from construction to daily life"
  profile: default
  expect: { tools_include: [simulate_development], events_include: [scene.intent, citation], intents_include: [development.play], done_status_in: [answered], text_includes: ["illustrative", "not an SDP project", "Brief: 30 storeys"], text_excludes: [" safe", "selamat", "flood", " deep"] }
