# Question catalogue: what people will ask TownshipLens, and whether the AI can answer it today.
#
# Purpose: define the target scope of the AI (investigation, 2026-10-15). It is NOT a test set yet.
# Promote items to evals/golden/ once each has an expected outcome the runner can check.
# Design and findings: docs/04-architecture/ai-target-design.md.
#
# How coverage was assessed: by reading the code on main at fd113e7 (tools in
# packages/spatial/src/townshiplens_spatial/tools.py, agent in packages/agent, seed data in
# data/seed/elmina). The questions were NOT run against a live model. Treat "coverage" as an
# engineering estimate until the baseline run (design doc, phase 0) measures it.
#
# coverage codes
#   covered       a tool exists and the seed has the data; expected to work in English today
#   lang_partial  covered in English, but a BM / Chinese answer hits the English-only validator
#                 or the English-only mock, so the user gets an English template answer
#   partial       a tool exists but does not return everything the question needs
#   data_gap      the tool exists; the seed lacks the place or attribute (honest "not recorded")
#   tool_gap      no tool gives the AI this capability (it must answer cannot_answer)
#   profile_gap   no routing profile matches the user's need
#   memory_gap    needs the previous turn; the agent has no conversation memory
#   decline       out of scope by design; the correct behaviour is to decline or redirect
#
# demo: how much the item matters for the pitch and judging (high | medium | low)

version: 1
date: 2026-10-15
assessed_on_commit: fd113e7

