[project]
name = "townshiplens"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["packages/spatial", "packages/agent", "apps/api"]

[tool.uv.sources]
townshiplens-spatial = { workspace = true }
townshiplens-agent = { workspace = true }
townshiplens-api = { workspace = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.0", "hypothesis==6.169.1", "ruff==0.17.0", "httpx==0.28.1", "tzdata==2026.5 ; sys_platform == 'win32'"]
data = [
    "rasterio==1.5.2",
    "scipy==1.18.1",
    "requests==2.34.2",
    "numpy>=2",
    "pyarrow==26.0.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/spatial/tests", "packages/agent/tests", "apps/api/tests", "data/scripts/tests", "evals/tests"]
asyncio_mode = "auto"
